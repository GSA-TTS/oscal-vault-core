    physicalName: "CRM/<crm>.md"
    description: >
      Customer Responsibility Matrix (CRM) content captured from a leveraged
      authorization's "CRM Controls" chapter (e.g. Chapter 14 "CR-N" sections
      such as "CR-1 Big Query", "CR-2 Looker Studio Pro"). Each CR-N section
      carries a stack of per-control "Responsibility Summary Information"
      tables describing the customer's implementation responsibility for an
      inherited/leveraged service. fismatic keys controls by id into a dict, so
      these CR tables (which reuse Chapter-13 control ids like AC-3) are
      overwritten and lost; this destination recovers them as their own notes.
    tags: [destination, oscal-extension, crm]
    customProperties:
