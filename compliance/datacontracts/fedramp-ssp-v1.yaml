  # --- DESTINATION: oscal.ssp.system environment & data (R14 closing-gaps) ---
  # R14: Added 3 new properties on oscal_ssp_system to capture the
  # high-frequency FedRAMP SSP sections that the inaugural report
  # flagged as unrouted (343 total across 10 docs):
  #   - System Environment        (9/10 SSPs, 123 paragraphs)
  #   - System Data Nature        (6/10 SSPs,  22 paragraphs)
  #   - Cloud Service Models      (2/10 SSPs,   4 paragraphs)
  #   - Cloud Deployment Models   (2/10 SSPs,   4 paragraphs)
  # These ride the same oscal.system-characteristics.oscalPath so they
  # land alongside the existing system description; the heading_text
  # is preserved as the property value (not body) for the model fields.
  # Existing properties (title, description, security_sensitivity_level)
  # are unchanged.

