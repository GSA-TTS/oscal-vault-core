# Open Data Contract Standard (ODCS v3.1.0) — FedRAMP SSP docx → vault routing
#
# This contract documents the to/from relationship for every source heading
# in a FedRAMP SSP .docx and where its content should land in the existing
# type taxonomy (oscal.*, oscal.x.*, okf.* — see
# .agents/skills/fedramp-vault/SKILL.md).
#
# It is consumed by:
#   - compliance/lib/heading_parser.py  (secondary parser, contract-driven)
#   - compliance/scripts/extract_by_contract.py  (CLI)
#
# And validated against:
#   compliance/datacontracts/schemas/odcs-json-schema-v3.1.0.json
#
# Conventions used in customProperties:
#   Object-level:
#     oscalType          — dotted vault type (e.g. "oscal.party")
#     oscalModel         — OSCAL model name (e.g. "party")
#     noteType           — disambiguator for types with multiple note flavors
#     destinationFolder  — vault folder (e.g. "Organizations/")
#     required           — true if this destination is mandatory for a valid SSP
#     multiple           — true if a single source yields many records
#     isSource           — true for the synthetic source object (the docx itself)
#   Property-level:
#     sourceHeading      — exact/prefix/regex match for the source .docx heading
#     sourceKind         — paragraph | table | image | constant | derived
#     captureStrategy    — heading_paragraph | heading_paragraph_first |
#                          heading_table_first | heading_table_all |
#                          heading_image_first | heading_image_all |
#                          heading_all | constant | derived
#     captureScope       — immediate_only (default) | until_next_same_or_higher
#     oscalPath          — primary dotted target in the OSCAL model.
#     nativeOscalPaths   — one or more native target paths; permits one
#                          authoring field to feed multiple assemblies.
#     mappingClass       — native_core | authoring_extension |
#                          true_extension | unimplemented.
#     mappingStatus      — active mappings must be claimed by a typed
#                          exporter adapter (validate_oscal_mappings.py).
#     exportAdapter      — exact typed adapter consuming this source property.
#     legacyExtensionPath / authoringExtensionType — preserve the vault's
#                          oscal.x authoring identity during migration.
#     note               — free-text note for reviewers
#     provenance         — link to the routing-decision row in INDEX.md
#
# Object-level (additional):
#     handledByPrimaryParser — true when the primary parser (fismatic) fills
#                          this object; the contract-driven secondary parser
#                          (heading_parser) then SKIPS it so its properties are
#                          not counted as "unfilled" (D-9 / #43).
#
# Adding a new mapping = edit this file; no code change required.

apiVersion: v3.1.0
kind: DataContract
id: fedramp-ssp-docx-to-vault-v1
name: fedramp_ssp_docx_to_vault
version: 1.0.0
status: active
domain: fedramp-ssp
tenant: GSA
contractCreatedTs: "2026-07-18T00:00:00Z"

tags:
  - fedramp
  - ssp
  - oscal
  - docx
  - vault
  - okf

description:
  purpose: >
    Establish the to/from contract between a FedRAMP SSP .docx source and the
    Obsidian vault destination types (oscal.*, oscal.x.*, okf.*). Every
    source heading currently DROPPED by the primary fismatic parser is mapped
    here to its destination note type, with capture strategy and OSCAL path.
  usage: >
    Consumed by compliance/lib/heading_parser.py to drive a secondary
    markdown-heading-based extractor. The primary fismatic parser handles
    Chapter 13 control implementation tables (oscal.control); this contract
    covers everything else (system identity, parties, architecture, data flow,
    inheritance, interconnections, references, etc.).
  limitations: >
    Source heading names follow the FedRAMP SSP rev5 template and are stable
    across the corpus, but hand-edited SSPs may use variations. Use the
    prefix (`*`) or `regex:` sourceHeading forms for tolerant matching.
    Review the catchall dump (examples/docx_catchall/) to confirm coverage.

servers:
  - id: local_docx
    server: local-fedramp-ssp
    type: local
    description: >
      Local .docx source files under fismatic/. No .docx is committed to the
      repo (see .gitignore); supply your own or use FedRAMP's public blank
      baseline templates.
    environment: dev
    customProperties:
      - property: path
        value: fismatic/*.docx
        description: Glob for FedRAMP SSP .docx source files.
      - property: format
        value: docx
      - property: primaryParser
        value: fismatic.SSPConverter
        description: >
          The primary parser (Chapter 13 control tables only). The contract
          + heading_parser.py form the secondary parser for everything else.
      - property: catchallDumper
        value: scripts/docx_catchall_dump.py
        description: >
          Produces the markdown intermediate this contract's capture
          strategies operate on.

authoritativeDefinitions:
  - id: odcs-spec
    url: https://bitol-io.github.io/open-data-contract-standard/latest/
    type: businessDefinition
    description: Open Data Contract Standard (ODCS) v3.1.0 specification.
  - id: odcs-schema
    url: https://raw.githubusercontent.com/bitol-io/open-data-contract-standard/main/schema/odcs-json-schema-v3.1.0.json
    type: implementation
    description: ODCS v3.1.0 JSON Schema (cached locally at compliance/datacontracts/schemas/).
  - id: vault-skill
    url: .agents/skills/fedramp-vault/SKILL.md
    type: businessDefinition
    description: FedRAMP vault type taxonomy (oscal.*, oscal.x.*, okf.*).
  - id: catchall-index
    url: examples/docx_catchall/INDEX.md
    type: businessDefinition
    description: >
      Routing-decision review surface with per-heading proposed destination
      and an empty Decision column for confirmation.
  - id: fedramp-template
    url: https://www.fedramp.gov/assets/resources/templates/SSP-Azure-FedRAMP-High-Baseline-Template.docx
    type: businessDefinition
    description: FedRAMP SSP rev5 template (source of canonical heading names).

customProperties:
  - property: sourceFormat
    value: docx
  - property: intermediateFormat
    value: markdown
    description: >
      The catchall dumper emits a markdown blob; the parser operates on that
      blob. Decoupling lets us re-run extraction with a new contract without
      re-parsing the .docx.
  - property: targetTaxonomy
    value: fedramp-vault
  - property: primaryParserScope
    value: chapter-13-control-tables
    description: >
      The primary fismatic parser handles Chapter 13 control implementation
      tables only. This contract covers everything else.
  - property: reviewSurface
    value: examples/docx_catchall/INDEX.md

# ---------------------------------------------------------------------------
# Schema: one synthetic source object + N destination objects
# ---------------------------------------------------------------------------
schema:
  # --- SOURCE ----------------------------------------------------------------
  - id: fedramp_ssp_docx
    name: fedramp_ssp_docx
    logicalType: object
    physicalType: file
    physicalName: "*.docx"
    description: >
      Synthetic source object representing the FedRAMP SSP .docx. Its
      properties enumerate the source headings the secondary parser can
      route from. Every destination property's `transformSourceObjects`
      references this object.
    tags: [source, docx]
    customProperties:
      - property: isSource
        value: true
      - property: sourceFormat
        value: docx
      - property: sourcePath
        value: fismatic/*.docx
    properties:
      - name: title
        logicalType: string
        description: Title-style paragraph at the top of the SSP (agency name).
        customProperties:
          - property: sourceHeading
            value: ""
          - property: sourceKind
            value: paragraph
          - property: note
            value: The first paragraph with style=Title in the document.
      - name: information_system_name
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Information System Name"
          - property: sourceKind
            value: table
      - name: information_system_owner
        logicalType: object
        customProperties:
          - property: sourceHeading
            value: "Information System Owner"
          - property: sourceKind
            value: table
      - name: authorizing_official
        logicalType: object
        customProperties:
          - property: sourceHeading
            value: "Authorizing Official"
          - property: sourceKind
            value: table
      - name: other_designated_contacts
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Other Designated Contacts"
          - property: sourceKind
            value: table
      - name: assignment_of_security_responsibility
        logicalType: object
        customProperties:
          - property: sourceHeading
            value: "Assignment of Security Responsibility"
          - property: sourceKind
            value: table
      - name: information_system_categorization
        logicalType: object
        customProperties:
          - property: sourceHeading
            value: "Information System Categorization"
          - property: sourceKind
            value: section
      - name: information_system_operational_status
        logicalType: object
        customProperties:
          - property: sourceHeading
            value: "Information System Operational Status"
          - property: sourceKind
            value: table
      - name: information_system_type
        logicalType: object
        customProperties:
          - property: sourceHeading
            value: "Information System Type"
          - property: sourceKind
            value: table
      - name: general_system_description
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "General System Description"
          - property: sourceKind
            value: paragraph
      - name: information_system_locations
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Information System Locations"
          - property: sourceKind
            value: table
      - name: information_system_components_and_boundaries
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Information System Components and Boundaries"
          - property: sourceKind
            value: paragraph
      - name: information_system_web_site_urls
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Information System Web Site URL Addresses"
          - property: sourceKind
            value: table
      - name: types_of_users
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Types of Users"
          - property: sourceKind
            value: table
      - name: network_architecture
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Network Architecture"
          - property: sourceKind
            value: paragraph
      - name: common_integrations
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Common Integrations:"
          - property: sourceKind
            value: paragraph
      - name: system_environment
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "System Environment"
          - property: sourceKind
            value: paragraph
      - name: asset_inventory
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Asset Inventory"
          - property: sourceKind
            value: table
      - name: external_services
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "External Services"
          - property: sourceKind
            value: table
      - name: software_inventory
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "regex:.*Software Inventory"
          - property: sourceKind
            value: table
      - name: data_flow
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Data Flow"
          - property: sourceKind
            value: section
      - name: ports_protocols_and_services
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Ports, Protocols and Services"
          - property: sourceKind
            value: table
      - name: transition_to_ipv6
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Transition to IPv6"
          - property: sourceKind
            value: paragraph
      - name: devops_devsecops_management
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "DevOps/DevSecOps Management"
          - property: sourceKind
            value: paragraph
      - name: container_based_workload_management
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "Container-Based Workload Management"
          - property: sourceKind
            value: paragraph
      - name: aws_management
        logicalType: string
        customProperties:
          - property: sourceHeading
            value: "AWS Management"
          - property: sourceKind
            value: paragraph
      - name: systems_providing_controls
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "regex:^Systems Providing Controls"
          - property: sourceKind
            value: table
      - name: systems_receiving_controls
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "regex:^Systems Receiving Controls"
          - property: sourceKind
            value: table
      - name: system_interconnections
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "System Interconnections"
          - property: sourceKind
            value: table
      - name: applicable_laws_and_regulations
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Applicable Laws and Regulations"
          - property: sourceKind
            value: table
      - name: acronyms_terms_and_definitions
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "regex:APPENDIX A.*Acronyms"
          - property: sourceKind
            value: table
      - name: references
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "regex:APPENDIX B.*References"
          - property: sourceKind
            value: table
      - name: hosted_subsystems
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "regex:APPENDIX C.*Hosted Subsystems"
          - property: sourceKind
            value: table
      - name: attachments
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Attachments"
          - property: sourceKind
            value: table
      - name: minimum_security_controls_showstoppers
        logicalType: array
        customProperties:
          - property: sourceHeading
            value: "Minimum Security Controls"
          - property: sourceKind
            value: table

  # --- DESTINATION: oscal.ssp (system + plan identity) -----------------------
  - id: oscal_ssp_system
    name: oscal_ssp
    logicalType: object
    physicalType: file
    physicalName: "Systems/<system>.md"
    description: >
      The system-level oscal.ssp note. Holds system identity, FIPS 199
      categorization, description, operational status, and FKs to parties.
      Currently the primary parser hardcodes system-name="System Name" and
      description="System Description" — this destination replaces those
      placeholders with real extracted values.
    tags: [destination, oscal, ssp]
    customProperties:
      - property: oscalType
        value: oscal.ssp
      - property: oscalModel
        value: system-security-plan
      - property: noteType
        value: system
      - property: destinationFolder
        value: Systems/
      - property: required
        value: true
    properties:
      - name: uuid
        logicalType: string
        description: OSCAL UUID for the system-security-plan.
        required: true
        primaryKey: true
        customProperties:
          - property: captureStrategy
            value: derived
          - property: oscalPath
            value: system-security-plan.uuid
          - property: note
            value: Generated UUID (parser hook).
      - name: title
        logicalType: string
        description: System name (currently hardcoded "System Name" by fismatic).
        required: true
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: "Take the system name from the Information System Name heading (first table, first data row)."
        customProperties:
          - property: sourceHeading
            value: "Information System Name"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.metadata.title
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: description
        logicalType: string
        description: General system description (currently hardcoded "System Description").
        required: true
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: "Concatenate paragraph text under the General System Description heading."
        customProperties:
          - property: sourceHeading
            value: "General System Description"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.system-characteristics.description
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: security_sensitivity_level
        logicalType: string
        description: FIPS 199 categorization (low | moderate | high).
        required: true
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: "Read from the document title block ('FIPS 199 Low' etc.) or the Information System Categorization section."
        customProperties:
          - property: sourceHeading
            value: "Information System Categorization"
          - property: sourceKind
            value: section
          - property: captureStrategy
            value: heading_paragraph
          - property: oscalPath
            value: system-security-plan.system-characteristics.security-sensitivity-level
          - property: note
            value: Map FIPS 199 text to one of low/moderate/high.
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: security_objective_confidentiality
        logicalType: string
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Potential Impacts of Security Objectives"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.system-characteristics.security-impact-level.security-objective-confidentiality
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: security_objective_integrity
        logicalType: string
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Potential Impacts of Security Objectives"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.system-characteristics.security-impact-level.security-objective-integrity
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: security_objective_availability
        logicalType: string
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Potential Impacts of Security Objectives"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.system-characteristics.security-impact-level.security-objective-availability
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: status_state
        logicalType: string
        description: Operational status (currently hardcoded "operational").
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Information System Operational Status"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.system-characteristics.status.state
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: system_information_types
        logicalType: array
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Information Types"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_all
          - property: oscalPath
            value: system-security-plan.system-characteristics.system-information.information-types
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: authorization_boundary_description
        logicalType: string
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Information System Components and Boundaries"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.system-characteristics.authorization-boundary.description
          - property: provenance
            value: "INDEX.md > Architecture & boundary"
      - name: digital_identity_acceptance
        logicalType: string
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Digital Identity Acceptance Statement"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: oscalPath
            value: system-security-plan.props
          - property: note
            value: No native OSCAL field; capture as a prop for now.
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: information_system_type
        logicalType: string
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Information System Type"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.props
          - property: note
            value: Capture system type (e.g. Major Information System).
          - property: provenance
            value: "INDEX.md > Front matter & system identity"
      - name: system_owner_party_uuid
        logicalType: string
        description: FK to oscal.party (the system owner).
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Information System Owner"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.responsible-parties[system-owner].party-uuid
          - property: provenance
            value: "INDEX.md > People & roles"
      - name: authorizing_official_party_uuid
        logicalType: string
        description: FK to oscal.party (the AO).
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Authorizing Official"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.responsible-parties[authorizing-official].party-uuid
          - property: provenance
            value: "INDEX.md > People & roles"
      - name: security_responsibility_party_uuid
        logicalType: string
        description: FK to oscal.party (the security officer).
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Assignment of Security Responsibility"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: heading_table_first
          - property: oscalPath
            value: system-security-plan.responsible-parties[security-responsible-officer].party-uuid
          - property: provenance
            value: "INDEX.md > People & roles"
      - name: system_environment_description
        logicalType: string
        description: >
          Narrative description of the system environment (hosting, OS,
          runtime, services). R14 addition to close 9/10 SSPs × ~14
          paragraphs gap flagged in inaugural report §4.
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "System Environment"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.system-characteristics.description
          - property: appendToExistingDescription
            value: true
          - property: provenance
            value: "R14 closing-gaps (inaugural report §4)"
      - name: system_data_nature
        logicalType: string
        description: >
          Description of the system's data types and handling. R14 addition
          to close 6/10 SSPs × ~4 paragraphs gap.
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "System Data Nature"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.system-characteristics.props[data-nature]
          - property: provenance
            value: "R14 closing-gaps (inaugural report §4)"
      - name: cloud_service_model
        logicalType: string
        description: >
          Cloud service model (SaaS, PaaS, IaaS, FaaS, hybrid). R14 addition
          for 2/10 SSPs.
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Cloud Service Models"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.system-characteristics.props[cloud-service-model]
          - property: provenance
            value: "R14 closing-gaps (inaugural report §4)"
      - name: cloud_deployment_model
        logicalType: string
        description: >
          Cloud deployment model (public, private, community, hybrid).
          R14 addition for 2/10 SSPs.
        transformSourceObjects: [fedramp_ssp_docx]
        customProperties:
          - property: sourceHeading
            value: "Cloud Deployment Models"
          - property: sourceKind
            value: paragraph
          - property: captureStrategy
            value: heading_paragraph
          - property: captureScope
            value: until_next_same_or_higher
          - property: oscalPath
            value: system-security-plan.system-characteristics.props[cloud-deployment-model]
          - property: provenance
            value: "R14 closing-gaps (inaugural report §4)"
    relationships:
      - type: foreignKey
        from: oscal_ssp.system_owner_party_uuid
        to: oscal_party.uuid
        customProperties:
          - property: label
            value: system-owner
