  # --- DESTINATION: oscal.control (Chapter 13 control implementation tables) ---
  - id: oscal_control
    name: oscal_control
    logicalType: object
    physicalType: file
    physicalName: "Controls/<control>.md"
    description: >
      Control implementation records (Chapter 13). Each FedRAMP SSP contains
      one control-summary table per implemented requirement. The secondary
      parser (heading_parser.py) can extract these via the `control_table`
      capture strategy from the catchall blob CONTROL TABLE (CAPTURED) tags.
      The primary parser (fismatic.SSPConverter) also handles these; set
      handledByPrimaryParser=false to use the contract-driven path instead.
    tags: [destination, oscal, control]
    customProperties:
      - property: oscalType
        value: oscal.control
      - property: oscalModel
        value: control
      - property: destinationFolder
        value: Controls/
      - property: required
        value: true
      - property: multiple
        value: true
      - property: handledByPrimaryParser
        value: true
        description: >
          When true, fismatic.SSPConverter + compliance.lib.oscal_source is the
          authoritative extractor; heading_parser skips re-extraction. Set to
          false to use the contract-driven secondary parser instead.
      # -----------------------------------------------------------------------
      # docx XML structure: Chapter 13 control-summary table layout
      # -----------------------------------------------------------------------
      # Every Chapter 13 control is a single 2-column docx table (or a
      # 2-table block: summary table + one or more continuation tables).
      # Row layout (standard FedRAMP SSP rev5 Word template):
      #
      #  Row 0  | <ControlID> <Title>                   | (merged heading cell)
      #  Row 1  | Control Summary Information            | (section label, merged)
      #  Row 2  | Responsible Role:                     | <role text (may be multi-line)>
      #  Row 3+ | Parameter <P-nn>:                     | <param value>   (0..N rows)
      #  Row N  | Implementation Status:                | <checkbox block — see below>
      #  Row M  | Control Origination:                  | <checkbox block — see below>
      #  Row K+ | Part <letter>: (or Part <number>:)   | <narrative prose>
      #         (continuation table rows for statement parts — may be in a
      #          separate adjacent table for long controls)
      #
      # Catchall blob TABLE tag format (from docx_catchall_dump.py):
      #   _[TABLE #N @ heading='<h>' rows=R cols=C class=CONTROL TABLE (CAPTURED) control_id='<ID>']_
      #   Followed by a markdown grid of the table cells.
      #
      # Checkbox encoding variants observed in corpus:
      #   Checked:   ☒ (U+2612)  ✓ (U+2713)  ⊠ (U+22A0)  [x]  [X]  x  X
      #   Unchecked: ☐ (U+2610)  [ ]
      #   Parser:    _is_checked() in fismatic/parser.py
      #   Pattern:   r'^[☒✓⊠]' | r'^\[[ xX]\]' | r'^[xX]\b'  (re.match after strip)
      #
      # Control ID extraction (row 0, col 0 header cell):
      #   Regex:   r'([a-z]{2})[\s-]*(\d+)(?:\s*\((\d+|[a-z]+)\))?'  (re.search, IGNORECASE)
      #   Groups:  (1) family  (2) number  (3) enhancement or None
      #   Normalize: f"{family.upper()}-{number}"  or  f"{family.upper()}-{number}({enhancement})"
      #   Examples: "AC-1", "AC-2(1)", "SI-4", "ac 1" -> "AC-1"
      #   Also in catchall blob: control_id='AC-1' attribute on TABLE tag.
      #
      # Implementation Status row detection:
      #   Label column: cells[0].text.strip().lower() contains 'implementation status'
      #   Value column: cells[-1].text  (full checkbox block as one string)
      #   Keyword matching (re.match, IGNORECASE, after _strip_checkbox()):
      #     implemented            -> r'^implemented\b'           -> OSCAL: "implemented"
      #     partially_implemented  -> r'^partially\s+implemented\b' -> "partially-implemented"
      #     planned                -> r'^planned\b'               -> "planned"
      #     alternative_impl       -> r'^alternative\s+implementation\b' -> "alternative-implementation"
      #     configured_by_customer -> r'^configured\s+by\s+customer\b' -> "customer-configured"
      #     not_applicable         -> r'^not\s+applicable\b'      -> "not-applicable"
      #     (no match)                                            -> "not-implemented"
      #
      # Control Origination row detection:
      #   Label column: cells[0].text.strip().lower() contains 'control origination'
      #   Value column: cells[-1].text  (checkbox block — multiple may be checked)
      #   Before keyword matching: strip parens via re.sub(r'\([^)]*\)', '', lower)
      #   Keyword matching (re.search, IGNORECASE):
      #     inherited              -> r'^inherited\s+from'                    -> "inherited"
      #     hybrid                 -> r'^(?:hybrid\s+control|service\s+provider\s+hybrid)' -> "hybrid"
      #     system_specific        -> r'^(?:system\s+specific\s+control|service\s+provider\s+system\s+specific)' -> "system-specific"
      #     service_provider_corp  -> r'(?:common\s+control|service\s+provider\s+corporate)' -> "service-provider-corporate"
      #     configured_by_customer -> r'^configured\s+by\s+customer'          -> "customer-configured"
      #     provided_by_customer   -> r'^provided\s+by\s+customer'             -> "customer-provided"
      #     shared                 -> r'^shared\b'                             -> "shared"
      #   Inherited-from name: re.search(r'inherited\s+from:?\s*(.+)', line, IGNORECASE).group(1)
      #   Hybrid systems: re.search(r'shared\s+between\s+(.+?)(?:;|\)|$)', line, IGNORECASE)
      #                   then split group(1) on r'\s+and\s+'
      #
      # Narrative part rows:
      #   Label column matches: re.match(r'(?:part|req\.?)\s*([a-z0-9]+)', label, IGNORECASE)
      #   Part key = group(1); statement-id = f"{control_id_lower}_stmt.{part_key}"
      #   control_id_lower = re.sub(r'\s+', '', control_id.strip().lower())
      #
      # Responsible Role row detection:
      #   cells[0].text.strip().lower() contains BOTH 'responsible' AND 'role'
      #   Value: cells[-1].text.strip() (may be multi-paragraph prose)
      #
      # Parameter rows (NOT yet extracted by fismatic):
      #   Label matches: re.match(r'^[Pp]arameter\s+(\S+):?\s*$', cells[0].text.strip())
      #   Group(1) = parameter ID token (e.g. 'ac-1_prm_1')
      #   Value: cells[-1].text.strip()
      - property: docxTableLayout
        value: "2-col row-per-field: [Row0:heading, Row1:label, Row2+:Responsible-Role/Parameter/Impl-Status/Ctrl-Origination/Part-N]"
        description: Standard FedRAMP SSP rev5 Chapter 13 table row layout.
      - property: controlIdRegex
        value: '([a-z]{2})[\s-]*(\d+)(?:\s*\((\d+|[a-z]+)\))?'
        description: Applied re.search(IGNORECASE) to row-0 col-0 cell text.
      - property: checkboxCheckedRegex
        value: '^[☒☑✓⊠]|^\[[ xX]\]|^[xX]\b'
        description: re.match after strip(). Unchecked marker is ☐ (U+2610). ☑ (U+2611) is a checked variant seen in some source SSPPs (e.g. FPDF).
      - property: implStatusRowLabel
        value: 'implementation status'
        description: Substring of cells[0].lower() identifying the status row.
      - property: ctrlOriginationRowLabel
        value: 'control origination'
        description: Substring of cells[0].lower() identifying the origination row.
      - property: responsibleRoleRowLabel
        value: 'responsible + role'
        description: Both substrings must appear in cells[0].lower().
      - property: partRowRegex
        value: '(?:part|req\.?)\s*([a-z0-9]+)'
        description: re.match(IGNORECASE) on cells[0].strip(). Group(1) = part key.
      - property: statementIdFormat
        value: '{control_id_lower}_stmt.{part_key}'
        description: >
          control_id_lower = re.sub(r'\s+','',control_id.strip().lower())
          Examples: "ac-1_stmt.a", "si-4_stmt.1", "ac-2(1)_stmt.b"
      - property: parameterRowRegex
        value: '^[Pp]arameter\s+(\S+):?\s*$'
        description: >
          NOT yet extracted by fismatic. Tweak this regex in the contract to
          enable parameter extraction via heading_parser.py control_table strategy.
      - property: catchallBlobTag
        value: 'CONTROL TABLE (CAPTURED)'
        description: >
          Class label in the catchall blob TABLE tag for control tables.
          Full tag: _[TABLE #N @ heading='...' rows=R cols=C class=CONTROL TABLE (CAPTURED) control_id='ID']_
    properties:
      - name: control_id
        logicalType: string
        required: true
        primaryKey: true
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          Extracted from row 0 col 0 (merged heading cell) of the Chapter 13
          control-summary table. Regex r'([a-z]{2})[\s-]*(\d+)(?:\s*\((\d+|[a-z]+)\))?'
          applied re.search(IGNORECASE). Normalized to "AC-1" / "AC-2(1)" form.
          Also carried in the catchall blob TABLE tag as control_id='ID'.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].control-id
          - property: docxLocation
            value: "table.rows[0].cells[0].text  — merged heading cell"
          - property: extractionRegex
            value: '([a-z]{2})[\s-]*(\d+)(?:\s*\((\d+|[a-z]+)\))?'
          - property: normalization
            value: >
              Groups: (1)=family.upper(), (2)=number, (3)=enhancement or None.
              Result: f"{family}-{number}" or f"{family}-{number}({enhancement})"
              Prefixes stripped first: "security control", "control", "requirement",
              "req.", "part"
          - property: provenance
            value: "fismatic/parser.py:normalize_control_id(), parse_control_id()"
      - name: implementation_status
        logicalType: string
        required: true
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          Single OSCAL state value. Found by scanning the Implementation Status
          value cell for the first checked checkbox and mapping its label to the
          OSCAL vocabulary via the keyword map.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].implementation-status.state
          - property: docxLocation
            value: >
              Row where cells[0].text.strip().lower() contains 'implementation status'.
              Value cell: cells[-1].text (full checkbox block string).
          - property: checkboxParsingNote
            value: >
              Each line of value-cell text is tested for checked state via
              _is_checked(): re.match(r'^[☒✓⊠]') | re.match(r'^\[[ xX]\]') |
              (re.match(r'^[xX]\b') AND NOT re.match(r'^[☐]')).
              Label = _strip_checkbox(line): lstrip('☒☐✓⊠'), re.sub(r'^\[[ xX]\]\s*',''),
              re.sub(r'^[xX]\s+',''), then strip().
          - property: statusKeywordMap
            value: >
              implemented            <- re.match(r'^implemented\b',          label_lower)
              partially_implemented  <- re.match(r'^partially\s+implemented\b', label_lower)
              planned                <- re.match(r'^planned\b',              label_lower)
              alternative_impl       <- re.match(r'^alternative\s+implementation\b', label_lower)
              configured_by_customer <- re.match(r'^configured\s+by\s+customer\b', label_lower)
              not_applicable         <- re.match(r'^not\s+applicable\b',     label_lower)
          - property: oscalStateMap
            value: >
              implemented            -> "implemented"
              partially_implemented  -> "partially-implemented"
              alternative_impl       -> "alternative-implementation"
              planned                -> "planned"
              configured_by_customer -> "customer-configured"
              not_applicable         -> "not-applicable"
              (none checked/matched) -> "not-implemented"
          - property: provenance
            value: "fismatic/parser.py:parse_implementation_status(), _status_to_oscal_state()"
      - name: control_origination
        logicalType: array
        required: false
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          List of OSCAL control-origination values; multiple checkboxes may be
          checked (e.g. inherited + system-specific). The "inherited from" provider
          name and "hybrid" system names are extracted by companion regexes.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].control-origination[]
          - property: docxLocation
            value: >
              Row where cells[0].text.strip().lower() contains 'control origination'.
              Value cell: cells[-1].text.
          - property: checkboxParsingNote
            value: >
              Same checkbox detection as implementation_status. For each checked
              line: content_lower = label.lower(); without_parens =
              re.sub(r'\([^)]*\)', '', content_lower).strip(). Keyword patterns
              (re.search) applied to without_parens.
          - property: originationKeywordMap
            value: >
              inherited              <- re.search(r'^inherited\s+from',        without_parens)
              hybrid                 <- re.search(r'^(?:hybrid\s+control|service\s+provider\s+hybrid)', without_parens)
              system_specific        <- re.search(r'^(?:system\s+specific\s+control|service\s+provider\s+system\s+specific)', without_parens)
              service_provider_corp  <- re.search(r'(?:common\s+control|service\s+provider\s+corporate)', without_parens)
              configured_by_customer <- re.search(r'^configured\s+by\s+customer', without_parens)
              provided_by_customer   <- re.search(r'^provided\s+by\s+customer',   without_parens)
              shared                 <- re.search(r'^shared\b',                   without_parens)
          - property: oscalOriginationMap
            value: >
              inherited              -> "inherited"
              hybrid                 -> "hybrid"
              system_specific        -> "system-specific"
              service_provider_corp  -> "service-provider-corporate"
              configured_by_customer -> "customer-configured"
              provided_by_customer   -> "customer-provided"
              shared                 -> "shared"
          - property: inheritedFromRegex
            value: 'inherited\s+from:?\s*(.+)'
            description: >
              re.search(IGNORECASE) on original (non-stripped) line when
              'inherited' flag is set. Group(1) = provider name. Trailing '.'
              stripped. Example: "Inherited From: cloud.gov" -> "cloud.gov".
          - property: hybridSystemsRegex
            value: 'shared\s+between\s+(.+?)(?:;|\)|$)'
            description: >
              re.search(IGNORECASE) on original line when 'hybrid' is set.
              Group(1) split on r'\s+and\s+'. Each element strip().strip(',').
          - property: provenance
            value: "fismatic/parser.py:parse_control_origination(), _origination_to_oscal_list()"
      - name: responsible_role
        logicalType: string
        required: false
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          Raw text of the Responsible Role cell. May be multi-paragraph prose.
          vault.py:_clean_role_text() distills to the first short line.
          _resolve_role_to_org() then resolves to an org wikilink.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].responsible-roles[].role-id
          - property: docxLocation
            value: >
              Row where cells[0].text.strip().lower() contains BOTH 'responsible'
              AND 'role'. Value cell: cells[-1].text.strip().
          - property: cleaningNote
            value: >
              vault.py:_clean_role_text(): first = rid.split('\n',1)[0].strip().
              If len(first)>80: first = first[:77]+'...'. rstrip(':').
              _resolve_role_to_org() lookup order:
              (1) exact match in role_index -> org wikilink,
              (2) substring match (name.lower() in rid_lower) -> org wikilink,
              (3) cleaned short name -> org wikilink,
              (4) raw cleaned text as fallback display string.
          - property: provenance
            value: "fismatic/parser.py:parse_control_table(), vault.py:_clean_role_text(), _resolve_role_to_org()"
      - name: statement_parts
        logicalType: array
        required: false
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          List of {statement-id, description} dicts; one per narrative part row.
          Also populated from continuation tables that immediately follow the
          summary table in the docx (handled by DocxParser.get_controls).
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].statements[]
          - property: docxLocation
            value: >
              Part rows: cells[0].text matches re.match(r'(?:part|req\.?)\s*([a-z0-9]+)', IGNORECASE).
              Continuation tables: separate docx table(s) immediately following
              the summary table, parsed by DocxParser via elif current_control branch.
          - property: statementIdFormat
            value: '{control_id_lower}_stmt.{part_key}'
            description: >
              control_id_lower = re.sub(r'\s+', '', control_id.strip().lower())
              part_key = match.group(1) from part-row regex.
              Examples: "ac-1_stmt.a", "si-4_stmt.1", "ac-2(1)_stmt.b"
          - property: narrativeSplittingNote
            value: >
              fismatic.parser._split_status_and_origination_blocks() pre-processes
              the full cell text: lines attributed to 'status'/'origination' mode
              when headers match _STATUS_HEADER_RE/ORIGIN_HEADER_RE; checkbox lines
              in those modes go into respective blocks; other lines = narrative.
              _extract_sections() then groups narrative under any 'Label:' style
              headers (re.match(r'^[A-Za-z][A-Za-z0-9 .,\'&()/-]{0,80}:$')).
              Each non-empty section -> a statement.
          - property: provenance
            value: "fismatic/parser.py:extract_control_content(), _extract_sections(), generate_statement_id()"
      - name: parameters
        logicalType: array
        required: false
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          Control parameter values from rows matching 'Parameter <ID>:' in col-0.
          NOT currently extracted by fismatic. Documented here to enable future
          contract-driven extraction by tweaking parameterRowRegex in this contract.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].set-parameters[]
          - property: docxLocation
            value: >
              Rows where cells[0].text.strip() matches
              re.match(r'^[Pp]arameter\s+(\S+):?\s*$'). Group(1) = param ID.
              Value: cells[-1].text.strip().
          - property: paramRowRegex
            value: '^[Pp]arameter\s+(\S+):?\s*$'
            description: >
              Tweak this regex to handle variations like "Param P-01:" or
              "Parameter: ac-1_prm_1". Changing this YAML value is sufficient
              when heading_parser.py control_table strategy reads it.
          - property: extractionStatus
            value: not-yet-implemented
            description: >
              Parameter rows are currently skipped by fismatic. Enable by
              setting extractionStatus=active and implementing in heading_parser.py.
          - property: provenance
            value: "fismatic/parser.py:parse_control_table() — NOT currently extracted"
      - name: customer_responsibilities
        logicalType: array
        required: false
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          Sentences from narrative text that describe obligations (must/shall/
          required to) borne by the customer agency or site owner.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].statements[].remarks
          - property: docxLocation
            value: "Narrative prose in description/implementation cells, after checkbox blocks."
          - property: obligationRegex
            value: '\b(must|shall|required\s+to|responsible\s+for|have\s+to|has\s+to|need(?:s)?\s+to|should)\b'
            description: >
              re.search(IGNORECASE) applied to each sentence from the narrative
              (sentences split on r'(?<=[.!?])\s+'). A sentence matching this
              regex is classified as a customer responsibility.
              To broaden: add alternatives like 'is required' or 'will need to'.
              To narrow: add actor context ('the customer must', 'agency shall').
          - property: actorRegex
            value: '\b(the\s+system|the\s+service\s+provider|the\s+organization|provider[s]?)\b.*\b(must|shall|implements?|provides?)\b'
            description: >
              Companion pattern for 'implementation requirements' (service provider
              obligations). Sentences matching this go to _extract_implementation_requirements
              rather than customer_responsibilities.
          - property: provenance
            value: "fismatic/parser.py:extract_customer_responsibilities(), _OBLIGATION_RE, _REQUIREMENT_ACTOR_RE"
      - name: crm
        logicalType: object
        required: false
        description: >
          Secondary CRM .ods fields merged into each matching control note by
          export_obsidian_vault.py; this is distinct from oscal.x.crm narrative
          notes, which are retained as unimplemented authoring sidecars.
        customProperties:
          - property: sourceKind
            value: sidecar
          - property: nativeOscalPaths
            value:
              - control-implementation.implemented-requirements[].by-components[].export.provided
              - control-implementation.implemented-requirements[].by-components[].export.responsibilities
          - property: mappingClass
            value: native_core
          - property: mappingStatus
            value: active
          - property: exportAdapter
            value: crm-control-sidecar
          - property: note
            value: CRM values are consumed from control frontmatter, not CRM narrative notes.
      - name: related_controls
        logicalType: array
        required: false
        transformSourceObjects: [fedramp_ssp_docx]
        transformDescription: >
          Control IDs referenced in narrative prose (e.g. "See AC-2 for
          account management"). Heuristically extracted by pattern scan;
          the current control's own ID is excluded.
        customProperties:
          - property: sourceHeading
            value: "regex:^(?:13\\.|Access Control|Awareness and Training|Awareness & Training|Audit and Accountability|Audit & Accountability|Assessment, Authorization, and Monitoring|Assessment, Authorization & Monitoring|Configuration Management|Contingency Planning|Identification and Authentication|Identification & Authentication|Incident Response|Maintenance|Media Protection|Physical and Environmental Protection|Physical & Environmental Protection|Planning|Personnel Security|Risk Assessment|System and Services Acquisition|System & Services Acquisition|System and Communications Protection|System & Communications Protection|System and Information Integrity|System & Information Integrity|Supply Chain Risk Management)"
          - property: sourceKind
            value: table
          - property: captureStrategy
            value: control_table
          - property: oscalPath
            value: control-implementation.implemented-requirements[].statements[].description
          - property: docxLocation
            value: "Narrative text in all statement/description cells of the control table."
          - property: relatedControlRegex
            value: '\b([A-Za-z]{2}-\d+(?:\s*\([^)]+\))?)\b'
            description: >
              re.finditer applied to each statement description. Matches NIST
              control IDs like "AC-2", "SI-4(a)", "AC-2 (1)". Results are
              de-duped; the current control's own normalized ID is excluded.
              Tweak this regex to handle non-standard IDs (e.g. "NIST AC-2").
          - property: referenceRegex
            value: '(?:see\s+also|see|reference[s]?:?)\s+([^\n.;]+)'
            description: >
              Secondary regex (fismatic.parser._REFERENCE_RE) for explicit
              'See also ...' / 'Reference: ...' sentences in narrative.
          - property: provenance
            value: "fismatic/parser.py:_REFERENCE_RE, vault.py:_extract_related_controls()"
    relationships:
      - type: foreignKey
        from: oscal_control.responsible_role
        to: oscal_party.uuid
        customProperties:
          - property: label
            value: responsible-role-to-party
          - property: resolutionNote
            value: >
              vault.py:_resolve_role_to_org() looks up role text against
              metadata.roles + metadata.parties to find the org wikilink.
              Match order: exact role-id, substring of party name, _clean_role_text() fallback.
