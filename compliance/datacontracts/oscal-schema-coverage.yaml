description: 'Evidence-based inventory of which OSCAL 1.1.3 schema fields the exporter emits (USED) vs
  does not (UNUSED), computed by exporting a representative committed vault and diffing against the vendored
  NIST schema. Each unused field carries a disposition: authoring_extension:<note> (the data already lives
  in that oscal.x.* note and is wire-able into native OSCAL), prop_backed (emitted as a prop today, not
  the structured assembly), genuinely_absent (no source anywhere), or unclassified. Regenerate with compliance/scripts/oscal_schema_coverage.py.'
