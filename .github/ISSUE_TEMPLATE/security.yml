name: Security concern
description: Report a potential security issue in oscal-vault-core
title: "[Security]: "
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Do not include CUI, customer SSP content, credentials, tokens, account
        identifiers, production URLs, exploit payloads, or sensitive logs.
        Submit a high-level triage report here. Maintainers will provide an
        approved private channel if sensitive follow-up is needed.
  - type: input
    id: version
    attributes:
      label: Affected public-core version or commit
      description: Provide a release tag or public commit SHA if known.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: High-level impact
      description: Describe the potential impact without sensitive operational detail.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction or mitigation details
      description: Include only sanitized, non-sensitive information.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I removed CUI, credentials, tokens, account identifiers, production URLs, and exploit payloads.
          required: true
