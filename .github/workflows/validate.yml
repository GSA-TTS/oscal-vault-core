name: Validate public core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3c1df4c07e8520e # v6.9.2
      - run: uv sync --frozen
      - run: uv run ruff check compliance/lib/docx_fill.py compliance/lib/oscal_source.py compliance/tests/test_docx_fill_roundtrip.py
      - run: uv run ruff format --check compliance/lib/docx_fill.py compliance/lib/oscal_source.py compliance/tests/test_docx_fill_roundtrip.py
      - run: uv run pytest tests/test_public_core_governance.py tests/test_public_core_oscal_source.py -q
      - run: uv run pytest compliance/tests/test_docx_fill_roundtrip.py -q -m slow -k synthetic_contract_sentinel
