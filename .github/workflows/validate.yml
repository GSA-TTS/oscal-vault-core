name: Validate public core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --frozen
      - run: uv run ruff check compliance tests
      - run: uv run ruff format --check compliance tests
      - run: uv run pytest tests compliance/tests -q -m "not slow"
      - run: uv run pytest compliance/tests/test_docx_fill_roundtrip.py -q -m slow -k synthetic_contract_sentinel
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: uv run python scripts/validate_mermaid_blocks.py
