name: Validate public core

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --frozen
      - run: uv run ruff check compliance/lib/docx_fill.py compliance/lib/oscal_source.py compliance/tests/test_docx_fill_roundtrip.py compliance/lib/topology*.py compliance/lib/canvas_forms.py compliance/lib/cyclonedx_tmbom.py compliance/lib/nist_standard.py compliance/scripts/validate_vault.py compliance/scripts/validate_frontmatter.py compliance/scripts/validate_wikilinks.py compliance/scripts/validate_cui_contracts.py compliance/scripts/validate_dataview_queries.py compliance/scripts/vault_changelog.py compliance/lib/control_identity.py compliance/lib/vault_notes.py compliance/lib/redaction.py compliance/lib/threat_model_checks.py compliance/scripts/evaluate_topology_diagrams.py compliance/tests/test_topology_generators.py compliance/tests/test_canvas_forms.py compliance/tests/test_cyclonedx_tmbom.py compliance/tests/test_nist_standard.py compliance/tests/test_validate_vault.py compliance/tests/test_vault_changelog.py compliance/tests/test_validate_cui_contracts.py compliance/tests/test_validate_dataview_queries.py compliance/tests/test_control_identity.py compliance/tests/test_vault_notes.py compliance/tests/test_redaction.py compliance/tests/test_threat_model_checks.py
      - run: uv run ruff format --check compliance/lib/docx_fill.py compliance/lib/oscal_source.py compliance/tests/test_docx_fill_roundtrip.py compliance/lib/topology*.py compliance/lib/canvas_forms.py compliance/lib/cyclonedx_tmbom.py compliance/lib/nist_standard.py compliance/scripts/evaluate_topology_diagrams.py compliance/tests/test_topology_generators.py compliance/tests/test_canvas_forms.py compliance/tests/test_cyclonedx_tmbom.py compliance/tests/test_nist_standard.py compliance/tests/test_validate_vault.py compliance/tests/test_vault_changelog.py compliance/tests/test_validate_cui_contracts.py compliance/tests/test_validate_dataview_queries.py compliance/tests/test_control_identity.py compliance/tests/test_vault_notes.py compliance/tests/test_redaction.py compliance/tests/test_threat_model_checks.py
      - run: uv run pytest tests compliance/tests -q -m "not slow"
      - run: uv run pytest compliance/tests/test_docx_fill_roundtrip.py -q -m slow -k synthetic_contract_sentinel
