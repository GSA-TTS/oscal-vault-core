[changelog]
header = "# Release notes\n\n"
body = "{% for group, commits in commits | group_by(attribute=\"group\") %}\n## {{ group }}\n{% for commit in commits %}- {{ commit.message }}\n{% endfor %}{% endfor %}"
[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [{ message = "^fix", group = "Fixes" }, { message = "^feat", group = "Features" }, { message = ".*", group = "Other changes" }]
